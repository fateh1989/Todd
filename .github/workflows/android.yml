name: Todd Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest --no-daemon

    - name: Assemble Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Verify APK Exists
      run: |
        test -f app/build/outputs/apk/debug/app-debug.apk || { echo "ERROR: app-debug.apk was not generated"; exit 1; }
        echo "Found APK at app/build/outputs/apk/debug/app-debug.apk with size: $(stat -c%s app/build/outputs/apk/debug/app-debug.apk) bytes"

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
