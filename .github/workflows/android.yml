name: Todd Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Configure Google Services for CI
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        if [ -n "$GOOGLE_SERVICES_JSON" ]; then
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          echo "Configured google-services.json from repository secret."
        elif [ ! -f app/google-services.json ]; then
          cat << 'EOF' > app/google-services.json
        {
          "project_info": {
            "project_number": "000000000000",
            "project_id": "todd-ci-build",
            "storage_bucket": "todd-ci-build.appspot.com"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                "android_client_info": {
                  "package_name": "com.todd"
                }
              },
              "oauth_client": [],
              "api_key": [
                {
                  "current_key": "AIzaSyCiBuildDummyKey0000000000000000000"
                }
              ],
              "services": {
                "appinvite_service": {
                  "other_platform_oauth_client": []
                }
              }
            }
          ],
          "configuration_version": "1"
        }
        EOF
          echo "Configured dummy google-services.json for CI compilation."
        fi

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest --no-daemon

    - name: Assemble Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Verify APK Exists
      run: |
        test -f app/build/outputs/apk/debug/app-debug.apk || { echo "ERROR: app-debug.apk was not generated"; exit 1; }
        echo "Found APK at app/build/outputs/apk/debug/app-debug.apk with size: $(stat -c%s app/build/outputs/apk/debug/app-debug.apk) bytes"

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
