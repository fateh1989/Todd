name: Todd Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test Android APK
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Configure Google Services for CI
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        if [ -n "$GOOGLE_SERVICES_JSON" ]; then
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          echo "Configured google-services.json from repository secret."
        elif [ ! -f app/google-services.json ]; then
          cat << 'EOF' > app/google-services.json
        {
          "project_info": {
            "project_number": "000000000000",
            "project_id": "todd-ci-build",
            "storage_bucket": "todd-ci-build.appspot.com"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                "android_client_info": {
                  "package_name": "com.todd"
                }
              },
              "oauth_client": [],
              "api_key": [
                {
                  "current_key": "AIzaSyCiBuildDummyKey0000000000000000000"
                }
              ],
              "services": {
                "appinvite_service": {
                  "other_platform_oauth_client": []
                }
              }
            }
          ],
          "configuration_version": "1"
        }
        EOF
          echo "Configured dummy google-services.json for CI compilation."
        fi

    - name: Configure Stable APK Signing
      env:
        TODD_SIGNING_BUNDLE: ${{ secrets.TODD_SIGNING_BUNDLE }}
      run: |
        set -euo pipefail

        if [ -z "$TODD_SIGNING_BUNDLE" ]; then
          echo "Stable signing bundle is not configured; Gradle debug signing will be used."
          exit 0
        fi

        extract_value() {
          printf '%s\n' "$TODD_SIGNING_BUNDLE" | tr -d '\r' | sed -n "s/^$1=//p" | head -n 1
        }

        TODD_KEYSTORE_BASE64="$(extract_value TODD_KEYSTORE_BASE64)"
        TODD_SIGNING_STORE_PASSWORD="$(extract_value TODD_SIGNING_STORE_PASSWORD)"
        TODD_SIGNING_KEY_ALIAS="$(extract_value TODD_SIGNING_KEY_ALIAS)"
        TODD_SIGNING_KEY_PASSWORD="$(extract_value TODD_SIGNING_KEY_PASSWORD)"

        for value in "$TODD_KEYSTORE_BASE64" "$TODD_SIGNING_STORE_PASSWORD" "$TODD_SIGNING_KEY_ALIAS" "$TODD_SIGNING_KEY_PASSWORD"; do
          if [ -z "$value" ]; then
            echo "ERROR: TODD_SIGNING_BUNDLE is missing one or more required values."
            exit 1
          fi
        done

        SIGNING_FILE="$RUNNER_TEMP/todd-stable-signing.jks"
        printf '%s' "$TODD_KEYSTORE_BASE64" | base64 --decode > "$SIGNING_FILE"

        {
          echo "TODD_SIGNING_STORE_FILE=$SIGNING_FILE"
          echo "TODD_SIGNING_STORE_PASSWORD=$TODD_SIGNING_STORE_PASSWORD"
          echo "TODD_SIGNING_KEY_ALIAS=$TODD_SIGNING_KEY_ALIAS"
          echo "TODD_SIGNING_KEY_PASSWORD=$TODD_SIGNING_KEY_PASSWORD"
        } >> "$GITHUB_ENV"

        echo "Stable Todd APK signing is configured."

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest --no-daemon

    - name: Assemble Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Verify APK Exists
      run: |
        test -f app/build/outputs/apk/debug/app-debug.apk || { echo "ERROR: app-debug.apk was not generated"; exit 1; }
        echo "Found APK at app/build/outputs/apk/debug/app-debug.apk with size: $(stat -c%s app/build/outputs/apk/debug/app-debug.apk) bytes"

    - name: Verify APK Signature
      run: |
        APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
        test -n "$APKSIGNER" || { echo "ERROR: apksigner was not found"; exit 1; }
        "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
