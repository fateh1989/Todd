name: Todd Stable Release APK

on:
  workflow_dispatch:

jobs:
  stable-release:
    name: Build Stable Signed Todd APK
    runs-on: ubuntu-latest
    env:
      EXPECTED_TODD_CERT_SHA256: 2354bcf2cbc13c549948898626cbc45509382b6f9b9e246d76355cce4d9e0d92

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Require stable signing bundle
      env:
        TODD_SIGNING_BUNDLE: ${{ secrets.TODD_SIGNING_BUNDLE }}
      run: |
        set -euo pipefail

        if [ -z "$TODD_SIGNING_BUNDLE" ]; then
          echo "ERROR: TODD_SIGNING_BUNDLE is not configured."
          exit 1
        fi

        extract_value() {
          printf '%s\n' "$TODD_SIGNING_BUNDLE" | tr -d '\r' | sed -n "s/^$1=//p" | head -n 1
        }

        TODD_KEYSTORE_BASE64="$(extract_value TODD_KEYSTORE_BASE64)"
        TODD_SIGNING_STORE_PASSWORD="$(extract_value TODD_SIGNING_STORE_PASSWORD)"
        TODD_SIGNING_KEY_ALIAS="$(extract_value TODD_SIGNING_KEY_ALIAS)"
        TODD_SIGNING_KEY_PASSWORD="$(extract_value TODD_SIGNING_KEY_PASSWORD)"

        for value in "$TODD_KEYSTORE_BASE64" "$TODD_SIGNING_STORE_PASSWORD" "$TODD_SIGNING_KEY_ALIAS" "$TODD_SIGNING_KEY_PASSWORD"; do
          if [ -z "$value" ]; then
            echo "ERROR: TODD_SIGNING_BUNDLE is missing one or more required values."
            exit 1
          fi
        done

        SIGNING_FILE="$RUNNER_TEMP/todd-stable-signing.jks"
        printf '%s' "$TODD_KEYSTORE_BASE64" | base64 --decode > "$SIGNING_FILE"

        {
          echo "TODD_SIGNING_STORE_FILE=$SIGNING_FILE"
          echo "TODD_SIGNING_STORE_PASSWORD=$TODD_SIGNING_STORE_PASSWORD"
          echo "TODD_SIGNING_KEY_ALIAS=$TODD_SIGNING_KEY_ALIAS"
          echo "TODD_SIGNING_KEY_PASSWORD=$TODD_SIGNING_KEY_PASSWORD"
        } >> "$GITHUB_ENV"

        echo "Stable Todd signing material loaded from one bundle secret."

    - name: Configure Google Services
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        if [ -n "$GOOGLE_SERVICES_JSON" ]; then
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
        fi

    - name: Run unit tests
      run: ./gradlew testDebugUnitTest --no-daemon

    - name: Assemble stable release APK
      run: ./gradlew assembleRelease --no-daemon

    - name: Verify stable release signer
      run: |
        set -euo pipefail
        APK="app/build/outputs/apk/release/app-release.apk"
        test -f "$APK" || { echo "ERROR: release APK was not generated"; exit 1; }
        APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
        test -n "$APKSIGNER" || { echo "ERROR: apksigner was not found"; exit 1; }
        ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest/{print $2; exit}' | tr '[:upper:]' '[:lower:]')"
        echo "Todd stable signer SHA-256: $ACTUAL"
        test "$ACTUAL" = "$EXPECTED_TODD_CERT_SHA256" || {
          echo "ERROR: release signer does not match Todd stable identity."
          exit 1
        }

    - name: Upload stable Todd APK
      uses: actions/upload-artifact@v4
      with:
        name: Todd-stable-release
        path: app/build/outputs/apk/release/app-release.apk
        if-no-files-found: error
