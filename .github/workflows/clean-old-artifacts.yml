name: Keep only the latest Actions artifact per name

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/clean-old-artifacts.yml"
  schedule:
    - cron: "17 4 * * *"

permissions:
  actions: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Remove superseded artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_ids="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" | jq -s -r '[.[] | .artifacts[] | select(.expired == false)] | group_by(.name) | map(sort_by(.created_at)[:-1][]) | .[].id')"
          if [[ -z "$artifact_ids" ]]; then
            echo "No superseded artifacts."
            exit 0
          fi
          while IFS= read -r artifact_id; do
            [[ -z "$artifact_id" ]] && continue
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/$artifact_id" >/dev/null
            echo "Deleted superseded artifact $artifact_id"
          done <<< "$artifact_ids"
